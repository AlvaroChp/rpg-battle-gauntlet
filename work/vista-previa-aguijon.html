    };
    for (const imagen of vista.querySelectorAll('img')) imagen.src = imagenes[imagen.dataset.icono];

    const aspecto = { tamano: 44, basico: '#101010', inferior: '#484848', normal: '#365b7d', superior: '#975ad7' };
    const calidades = ['inferior', 'normal', 'superior'];
    const secciones = vista.querySelectorAll('section');

    function ajustarTexto() {
      for (const ataque of vista.querySelectorAll('.ataque')) {
        const texto = ataque.lastElementChild;
        texto.style.removeProperty('font-size');
        const estilo = getComputedStyle(ataque);
        const disponible = ataque.clientWidth - Number.parseFloat(estilo.paddingLeft)
          - Number.parseFloat(estilo.paddingRight) - Number.parseFloat(estilo.columnGap) - 44;
        const ancho = texto.getBoundingClientRect().width;
        if (disponible > 0 && ancho > disponible) {
          texto.style.fontSize = (Number.parseFloat(getComputedStyle(texto).fontSize) * (disponible - 0.5) / ancho) + 'px';
        }
      }
    }

    function render() {
      vista.style.setProperty('--tamano-icono', aspecto.tamano + 'px');
      vista.style.setProperty('--fondo-basico', aspecto.basico);
      secciones.forEach((seccion, indice) => seccion.style.setProperty('--fondo-calidad', aspecto[calidades[indice]]));
      ajustarTexto();
    }

    render();
    new ResizeObserver(ajustarTexto).observe(vista);
    const ajustes = vista.querySelector('form');
    function aplicarAjustes() {
      for (const [nombre, valor] of new FormData(ajustes)) {
        aspecto[nombre] = nombre === 'tamano' ? Number(valor) : valor;
      }
      ajustes.querySelector('output').value = aspecto.tamano + ' px';
      render();
    }
    ajustes.addEventListener('input', aplicarAjustes);
    ajustes.addEventListener('reset', () => requestAnimationFrame(aplicarAjustes));
  })();
</script>
